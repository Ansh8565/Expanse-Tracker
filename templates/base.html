<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; max-width: 800px; }
        nav { margin-bottom: 20px; }
        nav a { margin-right: 15px; text-decoration: none; color: #007bff; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f4f4f4; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 8px 15px; background: #28a745; color: white; border: none; cursor: pointer; }
        .btn-danger { background: #dc3545; color: white; padding: 4px 8px; text-decoration: none; border-radius: 3px; }
        .btn-edit { background: #ffc107; color: black; padding: 4px 8px; text-decoration: none; border-radius: 3px; }
    </style>
</head>
<body>
    <nav>
        {% if session.get('user_id') %}
            <a href="/">Dashboard</a>
            <a href="/add">Add Expense</a>
            <a href="/logout">Logout</a>
        {% else %}
            <a href="/login">Login</a>
            <a href="/register">Register</a>
        {% endif %}
    </nav>
    <hr>
    {% block content %}{% endblock %}
</body>
</html>
